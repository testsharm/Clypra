name: Build Video Editor

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and set up FFmpeg (automatic, no manual steps)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z" -OutFile ffmpeg.7z
          7z x ffmpeg.7z -oC:\ffmpeg-extract
          $inner = Get-ChildItem C:\ffmpeg-extract | Select-Object -First 1
          Move-Item $inner.FullName C:\ffmpeg
          echo "FFMPEG_DIR=C:\ffmpeg" >> $env:GITHUB_ENV
          echo "C:\ffmpeg\bin" >> $env:GITHUB_PATH

      - name: Install npm dependencies
        run: npm install

      - name: Generate WiX component for FFmpeg DLLs (dynamic - matches real files, no hardcoding)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null
          Copy-Item "C:\ffmpeg\bin\ffmpeg.exe" "src-tauri\bin\ffmpeg-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item "C:\ffmpeg\bin\ffprobe.exe" "src-tauri\bin\ffprobe-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item "C:\ffmpeg\bin\*.dll" "src-tauri\bin\" -Force

          $dlls = Get-ChildItem "src-tauri\bin\*.dll"
          Write-Host "Found $($dlls.Count) actual DLL files to bundle:"
          $dlls | ForEach-Object { Write-Host " - $($_.Name)" }

          $componentXml = ""
          $refIds = @()
          $i = 0
          foreach ($dll in $dlls) {
            $id = "FFmpegDLL$i"
            $refIds += $id
            $componentXml += "    <Component Id=`"$id`" Guid=`"*`" Directory=`"INSTALLFOLDER`">`n"
            $componentXml += "      <File Source=`"src-tauri/bin/$($dll.Name)`" />`n"
            $componentXml += "    </Component>`n"
            $i++
          }

          $wxsContent = "<?xml version=`"1.0`" encoding=`"UTF-8`"?>`n<Wix xmlns=`"http://schemas.microsoft.com/wix/2006/wi`">`n  <Fragment>`n$componentXml  </Fragment>`n</Wix>"
          Set-Content -Path "src-tauri\ffmpeg-dlls.wxs" -Value $wxsContent -Encoding UTF8

          $confPath = "src-tauri\tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          if (-not ($conf.bundle.PSObject.Properties.Name -contains "windows")) {
            $conf.bundle | Add-Member -NotePropertyName "windows" -NotePropertyValue ([PSCustomObject]@{}) -Force
          }
          $wixObj = [PSCustomObject]@{
            fragmentPaths = @("ffmpeg-dlls.wxs")
            componentRefs = $refIds
          }
          $conf.bundle.windows | Add-Member -NotePropertyName "wix" -NotePropertyValue $wixObj -Force
          $conf | ConvertTo-Json -Depth 30 | Set-Content -Path $confPath -Encoding UTF8

          Write-Host "Patched tauri.conf.json with $($refIds.Count) componentRefs"

      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: powershell
        run: |
          npm run tauri build -- --bundles msi

      - name: Upload the finished installer
        uses: actions/upload-artifact@v4
        with:
          name: video-editor-installer
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Attach installer to a Release (only on success)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
